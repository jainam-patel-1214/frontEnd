<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
    <script src="./jq.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(188, 224, 255);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }

        #todo_main_div {
            height: 100%;
            width: 100%;
            overflow: scroll;
            background-color: rgba(240, 248, 255, 0.692);
            border: none;
            border-radius: 15px;
        }

        #user_data {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        #welcome_msg,
        #quote_of_day {
            margin: 5px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        #user_initials {
            width: 50px;
            height: 50px;
            font-size: xx-large;
            background-image: linear-gradient(to top right, rgb(192, 119, 251), rgb(99, 202, 250));
            margin: 5px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #lineBrk {
            height: 1px;
            width: 95%;
            background: rgba(175, 175, 175, 0.37);
            margin: 0 auto 1rem;
        }

        #todo_data_div {
            background: rgba(255, 255, 255, 0.747);
            border-radius: 15px;
            border: none;
            height: inherit;
            overflow: scroll;
            margin: 5px 1rem;
        }

        #div_header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        #new_btn {
            background: rgba(0, 255, 128, 0.2);
            color: gray;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid rgba(7, 66, 0, 0.061);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 5px rgba(0, 255, 128, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #new_btn:hover {
            background: rgba(0, 255, 128, 0.35);
            box-shadow: 0 6px 25px rgba(0, 255, 128, 0.4);
            transform: translateY(-2px);
        }

        #del_btn {
            background: rgba(255, 0, 0, 0.2);
            color: gray;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid rgba(66, 0, 0, 0.061);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 5px rgba(255, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #del_btn:hover {
            background: rgba(255, 0, 0, 0.35);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        #filter_btn {
            background: rgba(0, 191, 255, 0.2);
            color: gray;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid rgba(0, 45, 66, 0.061);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 5px rgba(0, 208, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #filter_btn:hover {
            background: rgba(0, 140, 255, 0.35);
            box-shadow: 0 6px 25px rgba(0, 145, 255, 0.4);
            transform: translateY(-2px);
        }

        #add_new_task {
            display: none;
            text-align: left;
            position: absolute;
        }

        #search_inp {
            width: 250px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px) saturate(150%);
            color: #333;
            transition: all 0.3s ease;
        }

        #search_inp::placeholder {
            color: rgba(50, 50, 50, 0.6);
        }

        #content {
            margin: 1rem;
            border-radius: 15px;
            background-color: rgba(215, 236, 255, 0.796);
            height: inherit;
            display: flex;
            flex-direction: column;
        }

        #task_form {
            position: relative;
            width: 700px;
            padding: 30px 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        label {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: #28a745;
            cursor: pointer;
        }

        select {
            cursor: pointer;
        }

        .submit_btn_add_new_task {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(40, 167, 69, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .submit_btn_add_new_task:hover {
            background: rgba(40, 167, 69, 0.6);
            transform: translateY(-2px);
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            height: fit-content;
            margin-left: -125px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 16px;
            position: fixed;
            left: 50%;
            top: 30px;
            font-size: 17px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.5s ease, bottom 0.5s ease;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
        .pendingtitle{
            font-size: xx-large;
            margin-left: 1rem;
            margin: 1rem;
        }
        .pendingtitle p{
            margin: 0;
        }
        #completed_tasks,#pending_tasks {
            height: 30%;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: row;
            overflow-y: hidden;
            overflow-x: scroll;
        }

        .pending_item {
            height: 250px;
            width: 300px;
            background-color: rgb(201, 230, 255);
            border-radius: 15px;
            margin: 1rem;
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        #pBox2{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .pMoreInfo{
            background-color: rgb(146, 204, 255);
            border: none;
            border-radius: 15px;
            margin: 10px;
            padding: 10px;
            cursor: pointer;
            transition: .5s;
        }
        .pMoreInfo:hover{
            background-color: rgb(102, 184, 255);
        }

        #more_info_tasks{
            position: absolute;
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.438);
            backdrop-filter: blur(10px);
            display: none;
        }
        [id^="mi_box_"] {
        display: flex;
        flex-direction: row;
        align-items: center;
    }
       [id^="mi_box_"] h3 {
        margin-left: 1rem;
    }
    [id^="mi_box_"] p {
        margin-right: 1rem;
    }
    #close_more_info{
        position: absolute;
        right: 10px;
        top: 10px;
        background-color: red;
        padding: 5px;
        border-radius: 50%;
        text-align: center;
        height: 20px;
        width: 20px;
        cursor: pointer;
    }

    #filter_display_tasks{
        display: none;
        position: absolute;
        border: thick double #32a1ce;
    }
    #filter_form{
        display: flex;
        flex-direction: column;
        background-color: rgba(255, 255, 255, 0.438);
        backdrop-filter: blur(10px);
        padding: 1rem;
    }
    #completion_filter,#date_range_filter,#priority_filter{
        display: flex;
        flex-direction: row;
        margin: 15px;
    }
    #completion_filter input, #date_range_filter input{
        margin-right: 15px;
    }
    #filter_form button{
        width: fit-content; align-self: center; background-color: #32a1ce; padding: 10px; border-radius: 15px; border: none; cursor: pointer;
    }
    #filter_form button:hover{
        background-color: #55b2d6;
    }
        
    </style>
</head>

<body>
    <div id="toast"></div>
    <div id="todo_main_div">
        <div id="user_data">
            <div style="width: inherit; height: inherit; display: flex; align-items: center;">
                <div id="user_initials">
                    <p style="margin: 0; padding: 0;"></p>
                </div>
                <h1 id="welcome_msg"></h1>
            </div>
            <p id="quote_of_day"></p>
        </div>
        <div id="lineBrk"></div>
        <div id="todo_data_div">
            <div id="div_header">
                <h3 style="margin: 1rem;">TODOs</h3>
                <div id="todo_options" style="margin: 1rem;">
                    <button id="new_btn" type="button">New Task</button>
                    <button id="del_btn" type="button">Delete</button>
                    <input type="text" placeholder="🔍 Search by title.." id="search_inp">
                    <button id="filter_btn" type="button">Filter</button>
                </div>

            </div>
            <div id="content">
                <div class="pendingtitle">
                    <p>Pending Tasks: </p>
                </div>
                <div id="pending_tasks">
                    
                </div>
                <div class="pendingtitle">
                    <p>Completed Tasks: </p>
                </div>
                <div id="completed_tasks">
                </div>
            </div>
        </div>
    </div>
    <div id="add_new_task">
        <form id="task_form">
            <div style="position: absolute; color: white; background-color: red; height: 20px; width: 20px; border-radius: 10px; right: 5px; top: 5px; text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; cursor: pointer;"
                id="close_add_form">
                X
            </div>
            <div class="form-row">
                <input type="text" placeholder="🗂️ Category" required id="task_category" />
                <input type="text" placeholder="📝 Title" required id="task_title" />
                <input type="text" placeholder="👤 Assigned To" required id="task_asignned_to" />
            </div>
            <div class="form-row">
                <textarea placeholder="🖊️ Description" required id="task_desc"></textarea>
            </div>
            <div class="form-row">
                <label for="dateCreation">Date task was created</label>
                <input type="date" title="Task Created Date" required id="task_created_at" name="dateCreation"/>
                <label for="completionDate">Expected completion date</label>
                <input type="date" title="Due Date" id="task_complete_at" name="completionDate"/>
            </div>
            <div class="form-row">
                <select required id="task_priority">
                    <option value="">⚡ Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="none" disabled>None</option>
                </select>

                <label>⏰ <input type="checkbox" id="task_reminder" /> Set Reminder</label>
                <label>👍 <input type="checkbox" id="task_completed" /> Task Completed</label>
            </div>
            <div class="form-row">
                <textarea placeholder="💬 Additional Comments" id="task_comments"></textarea>
            </div>

            <button type="submit" class="submit_btn_add_new_task">📩 Submit Task</button>
        </form>
    </div>
    <div id="filter_display_tasks">
        <div style="z-index: 5;position: absolute; color: white; background-color: red; height: 20px; width: 20px; border-radius: 10px; right: 5px; top: 5px; text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; cursor: pointer;"
            id="close_filter_form">
            X
        </div>
        <form id="filter_form">
            <div id="completion_filter">
                <p>Filter by completion:&nbsp;&nbsp;</p>
                <label for="pending_filter">Only Pending tasks</label>
                <input type="checkbox" name="pending_filter" id="pending_tasks_filter">
                <label for="completed_filter">Only Completed tasks</label>
                <input type="checkbox" name="completed_filter" id="completed_tasks_filter">
            </div>
            <div id="priority_filter">
                <p>Filter by priority:&nbsp;&nbsp;</p>
                <select id="pf" style="width: fit-content;">
                    <option value="">Select Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <button type="reset" id="clear_filters">Clear Filters</button>
        </form>
    </div>
    <div id="more_info_tasks">
        <div id="close_more_info">X</div>
        <div id="mi_box_1">
            <h3>Category: </h3>
            <p></p>
        </div>
        <div id="mi_box_2">
            <h3>Title: </h3>
            <p></p>
        </div>
        <div id="mi_box_3">
            <h3>Description: </h3>
            <p></p>
        </div>
        <div id="mi_box_4">
            <h3>Task assigned to: </h3>
            <p></p>
        </div>
        <div id="mi_box_5">
            <h3>Task Created on: </h3>
            <p></p>
            <h3>Task to be completed till: </h3>
            <p></p>
        </div>
        <div id="mi_box_6">
            <h3>Priority: </h3>
            <p></p>
        </div>
        <div id="mi_box_7">
            <h3>Additional Comments: </h3>
            <p></p>
        </div>
    </div>
    <script src="./dashboard.js"></script>
</body>

</html>
